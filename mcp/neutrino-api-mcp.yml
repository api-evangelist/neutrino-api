notes:
- /multi (batch processing) is documented at https://www.neutrinoapi.com/api/batch-processing/ but is
  absent from the OpenAPI, so no tool is derived for it. An MCP server would want it — it is the only
  way to fan out 2500 lookups in one call.
- The five Legacy endpoints (user-agent-info, html5-render, sms-message, html-extract-tags, code-highlight)
  are excluded from the spec and therefore from this list. See lifecycle/neutrino-api-lifecycle.yml.
- Three tools have real-world side effects and cost money per call (phone_verify, sms_verify, phone_playback)
  and one is a bulk data download (ip_blocklist_download, bin_list_download). An MCP server should gate
  those behind explicit confirmation rather than exposing them as free reads.
