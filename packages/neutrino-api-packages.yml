method: searched
source: >-
  https://www.neutrinoapi.com/api/sdks/ and https://github.com/NeutrinoAPI —
  verified against the public package registries (registry.npmjs.org,
  pypi.org, packagist.org, api.nuget.org) on 2026-08-09.
description: >-
  Neutrino API ships eleven first-party "light-weight" client libraries, one per
  language/HTTP-stack combination, all auto-generated from and tested against
  the published API specification and all released together on a single version
  line (currently v4.7.1). The primary distribution channel is a source download
  from GitHub, NOT a package registry: only the Node native client, the PHP
  libcURL client and the older APIMATIC-generated SDKs are published to
  registries. That is the one real gap in an otherwise strong SDK story — a Go,
  Rust, Python-native, Java or C# developer cannot `go get` / `cargo add` /
  `pip install` / Maven-coordinate the current client.
sdk_release_line: v4.7.1
docs: https://www.neutrinoapi.com/api/sdks/
packages:
  - language: javascript
    registry: npm
    name: neutrino-api-client-node
    version: 4.7.1
    url: https://www.npmjs.com/package/neutrino-api-client-node
    source: https://github.com/NeutrinoAPI/neutrino-api-client-node
    install: npm install neutrino-api-client-node
    official: true
    note: Published by the npm user `neutrinoapi` (ops@neutrinoapi.com). Native HTTP, no dependencies.
  - language: php
    registry: packagist
    name: neutrino_api/neutrino_api_client
    version: 4.7.1
    url: https://packagist.org/packages/neutrino_api/neutrino_api_client
    source: https://github.com/NeutrinoAPI/neutrino-api-client-libcurl
    install: composer require neutrino_api/neutrino_api_client
    official: true
    note: PHP client using the libcURL extension; tracks the current v4.7.1 release line.
  - language: dotnet
    registry: nuget
    name: NeutrinoAPI
    version: 3.6.0
    url: https://www.nuget.org/packages/NeutrinoAPI
    source: https://github.com/NeutrinoAPI/NeutrinoAPI-CSharp
    install: dotnet add package NeutrinoAPI
    official: true
    status: legacy
    note: >-
      APIMATIC-generated SDK on the older 3.x line (last published 2022-11-28);
      the GitHub source repo is archived. Superseded by the v4.7.1
      neutrino-api-client-csharp source download.
  - language: python
    registry: pypi
    name: neutrino-api
    version: 3.4.5
    url: https://pypi.org/project/neutrino-api/
    source: https://github.com/NeutrinoAPI/NeutrinoAPI-Python
    install: pip install neutrino-api
    official: true
    status: legacy
    note: >-
      APIMATIC-generated SDK on the older 3.x line; the GitHub source repo is
      archived. Superseded by the v4.7.1 neutrino-api-client-requests /
      neutrino-api-client-urllib source downloads.
  - language: php
    registry: packagist
    name: neutrinoapi/neutrinoapi_php_sdk
    version: 3.4.5
    url: https://packagist.org/packages/neutrinoapi/neutrinoapi_php_sdk
    source: https://github.com/NeutrinoAPI/NeutrinoAPI-PHP
    install: composer require neutrinoapi/neutrinoapi_php_sdk
    official: true
    status: legacy
    note: APIMATIC-generated 3.x PHP SDK; the GitHub source repo is archived.
