  observed: {checked: '2026-08-09', indicator: none, description: All Systems Operational}

sla:
  published_uptime_target: null
  note: >-
    No numeric uptime SLA is published. The company states 24/7 global
    operations and support, and paid accounts get 24/7 online technical support
    at no extra charge (https://www.neutrinoapi.com/plans/). Custom data-center
    and region placement is available on a custom plan by contract.

