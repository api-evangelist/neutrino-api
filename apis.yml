name: Neutrino API
description: >-
  Neutrino API is a general-purpose API collection that solves common but recurring software-development
  problems: data validation, telephony, geolocation, security and networking, e-commerce and imaging. It is a
  single flat REST-style HTTP API of 28 published operations — one verb path each, no resources and no stored
  state — accepting GET or POST and authenticated with two headers, user-id and api-key. The same operation set
  is served from seven hostnames: a default multicloud anycast endpoint, AWS-only and GCP-only endpoints, a
  backup on a separate TLD, and EU, Australia and USA geofence endpoints that guarantee in-boundary processing.
  Machine-readable definitions are published in eight formats from one source (OpenAPI 3.1, Swagger 2.0, RAML,
  WADL, WSDL, API Blueprint, Postman and Insomnia) and advertised through an RFC 9727 /.well-known/api-catalog.
  Bootstrapped and customer-funded, based in Auckland, New Zealand, operating since 2013 and serving more than
  800 million API requests a day.
